<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin login — Maisonia</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="image-side">
      <div class="ovr">
        <h2>Welcome back, Admin.</h2>
        <p style="opacity:.85">Manage properties, messages and analytics from one elegant dashboard.</p>
      </div>
    </div>
    <div class="form-side">
      <div class="auth-card">
        <a class="logo" href="index.html">Maison<span>ia</span></a>
        <h1>Sign in</h1>
        <p class="sub">Enter your admin credentials to continue.</p>
        <div id="error" class="auth-error"></div>
        <form id="login-form">
          <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required placeholder="admin@maisonia.com">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required placeholder="••••••••">
          </div>
          <button class="btn btn-primary" type="submit" id="submit-btn"><i class="fas fa-arrow-right"></i> Sign in</button>
        </form>
        <p style="margin-top:24px;font-size:.85rem;color:var(--gray-3);text-align:center">
          <a href="index.html"><i class="fas fa-arrow-left"></i> Back to site</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module">
    import { login } from './js/auth.js';
    import { watchAuth } from './js/auth.js';

    // If already logged in, redirect
    watchAuth((u) => { if (u) location.replace('admin/admin-dashboard.html'); });

    const form = document.getElementById('login-form');
    const err = document.getElementById('error');
    const btn = document.getElementById('submit-btn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.classList.remove('show');
      btn.disabled = true; btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px"></div> Signing in...';
      const fd = new FormData(form);
      try {
        await login(fd.get('email'), fd.get('password'));
        location.replace('admin/admin-dashboard.html');
      } catch (e) {
        err.textContent = e.code === 'auth/invalid-credential' ? 'Invalid email or password.' : (e.message || 'Sign-in failed.');
        err.classList.add('show');
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-arrow-right"></i> Sign in';
      }
    });
  </script>
</body>
</html>
