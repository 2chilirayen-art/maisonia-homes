<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — RaniaDjerba Admin</title>
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="sidebar">
      <div class="brand">Rania<span>Djerba</span></div>
      <nav class="admin-nav">
        <a href="admin-dashboard.html" class="active"><i class="fas fa-th-large"></i> Dashboard</a>
        <a href="properties-manager.html"><i class="fas fa-home"></i> Properties</a>
        <a href="add-property.html"><i class="fas fa-plus-circle"></i> Add property</a>
        <a href="messages.html"><i class="fas fa-envelope"></i> Messages</a>
        <a href="#"><i class="fas fa-chart-line"></i> Analytics</a>
        <a href="#"><i class="fas fa-cog"></i> Settings</a>
      </nav>
      <div class="admin-user">
        <div class="avatar" id="user-avatar">A</div>
        <div style="flex:1;min-width:0"><strong id="user-email" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block">…</strong><span>Administrator</span></div>
        <button class="btn-icon" id="logout-btn" title="Sign out"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="admin-toggle" id="toggle-sidebar"><i class="fas fa-bars"></i></button>
          <h1>Dashboard</h1>
        </div>
        <div class="actions">
          <a href="add-property.html" class="btn btn-primary"><i class="fas fa-plus"></i> Add property</a>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-card c1"><div class="icn"><i class="fas fa-home"></i></div><div><div class="label">Total properties</div><div class="num" id="s-props">0</div></div></div>
        <div class="stat-card c2"><div class="icn"><i class="fas fa-envelope"></i></div><div><div class="label">Messages</div><div class="num" id="s-msgs">0</div></div></div>
        <div class="stat-card c3"><div class="icn"><i class="fas fa-eye"></i></div><div><div class="label">Total views</div><div class="num">8,420</div></div></div>
        <div class="stat-card c4"><div class="icn"><i class="fas fa-dollar-sign"></i></div><div><div class="label">Avg price</div><div class="num" id="s-avg">0 TND</div></div></div>
      </div>

      <div class="charts-grid">
        <div class="panel">
          <div class="panel-head"><h2>Properties by city</h2><p>Live</p></div>
          <canvas id="cityChart" height="120"></canvas>
        </div>
        <div class="panel">
          <div class="panel-head"><h2>By type</h2></div>
          <canvas id="typeChart" height="120"></canvas>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Recent properties</h2><a href="properties-manager.html" class="btn btn-outline">Manage all</a></div>
        <div class="table-wrap">
          <table class="admin-table">
            <thead><tr><th>Property</th><th>City</th><th>Price</th><th>Beds</th><th>Type</th></tr></thead>
            <tbody id="recent-tbody"><tr><td colspan="5"><div class="spinner"></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireAdmin, logout } from '../js/auth.js';
    import { subscribeProperties } from '../js/properties.js';
    import { db, collection, onSnapshot } from '../js/firebase-config.js';
    import { escapeHtml, formatPrice } from '../js/ui.js';

    const user = await requireAdmin();
    document.getElementById('user-email').textContent = user.email;
    document.getElementById('user-avatar').textContent = (user.email[0] || 'A').toUpperCase();
    document.getElementById('logout-btn').addEventListener('click', async () => { await logout(); location.replace('../login.html'); });
    const _sb=document.getElementById('sidebar');const _tg=document.getElementById('toggle-sidebar');_tg.addEventListener('click',()=>{const o=_sb.classList.toggle('open');document.body.classList.toggle('sidebar-open',o);});document.addEventListener('click',(e)=>{if(!_sb.classList.contains('open'))return;if(!_sb.contains(e.target)&&!_tg.contains(e.target)){_sb.classList.remove('open');document.body.classList.remove('sidebar-open');}});

    let cityChart, typeChart;
    subscribeProperties((items) => {
      document.getElementById('s-props').textContent = items.length;
      const avg = items.length ? Math.round(items.reduce((a,b) => a + (+b.price || 0), 0) / items.length) : 0;
      document.getElementById('s-avg').textContent = formatPrice(avg);

      const tbody = document.getElementById('recent-tbody');
      const recent = items.slice(0, 6);
      tbody.innerHTML = recent.length ? recent.map(p => `
        <tr>
          <td><div class="row-cell">
            <img class="thumb" src="${(p.images && p.images[0]) || 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=200'}">
            <div><strong>${escapeHtml(p.title || 'Untitled')}</strong><span>${escapeHtml(p.address || '')}</span></div>
          </div></td>
          <td>${escapeHtml(p.city || '—')}</td>
          <td><strong>${formatPrice(p.price)}</strong></td>
          <td>${p.bedrooms ?? 0}</td>
          <td><span class="chip gold">${escapeHtml(p.type || 'Rent')}</span></td>
        </tr>
      `).join('') : '<tr><td colspan="5" class="empty-row">No properties yet.</td></tr>';

      // City chart
      const byCity = {};
      items.forEach(p => { byCity[p.city || 'Unknown'] = (byCity[p.city || 'Unknown'] || 0) + 1; });
      const cLabels = Object.keys(byCity), cData = Object.values(byCity);
      if (cityChart) cityChart.destroy();
      cityChart = new Chart(document.getElementById('cityChart'), {
        type: 'bar',
        data: { labels: cLabels, datasets: [{ data: cData, backgroundColor: '#06B6D4', borderRadius: 8 }] },
        options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
      });

      const byType = {};
      items.forEach(p => { byType[p.type || 'Other'] = (byType[p.type || 'Other'] || 0) + 1; });
      if (typeChart) typeChart.destroy();
      typeChart = new Chart(document.getElementById('typeChart'), {
        type: 'doughnut',
        data: { labels: Object.keys(byType), datasets: [{ data: Object.values(byType), backgroundColor: ['#D4A373','#06B6D4','#0F172A','#10B981','#8B5CF6','#EF4444'] }] },
        options: { plugins: { legend: { position: 'bottom' } } }
      });
    });

    onSnapshot(collection(db, 'messages'), (snap) => {
      document.getElementById('s-msgs').textContent = snap.size;
    });
  </script>
</body>
</html>
