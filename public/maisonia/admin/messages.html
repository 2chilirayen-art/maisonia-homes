<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages — RaniaDjerba Admin</title>
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="sidebar">
      <div class="brand">Rania<span>Djerba</span></div>
      <nav class="admin-nav">
        <a href="admin-dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a>
        <a href="properties-manager.html"><i class="fas fa-home"></i> Properties</a>
        <a href="add-property.html"><i class="fas fa-plus-circle"></i> Add property</a>
        <a href="messages.html" class="active"><i class="fas fa-envelope"></i> Messages</a>
        <a href="#"><i class="fas fa-chart-line"></i> Analytics</a>
        <a href="#"><i class="fas fa-cog"></i> Settings</a>
      </nav>
      <div class="admin-user">
        <div class="avatar" id="user-avatar">A</div>
        <div style="flex:1;min-width:0"><strong id="user-email" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block">…</strong><span>Administrator</span></div>
        <button class="btn-icon" id="logout-btn"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="admin-toggle" id="toggle-sidebar"><i class="fas fa-bars"></i></button>
          <h1>Messages</h1>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Inbox</h2><p id="count">…</p></div>
        <div class="table-wrap">
          <table class="admin-table">
            <thead><tr><th>From</th><th>Subject</th><th>Property</th><th>Received</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead>
            <tbody id="tbody"><tr><td colspan="6"><div class="spinner"></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:20px">
    <div style="background:white;max-width:600px;width:100%;border-radius:18px;padding:30px;max-height:90vh;overflow:auto">
      <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:20px">
        <h2 id="m-subject" style="font-family:'Playfair Display',serif">Message</h2>
        <button class="btn-icon" id="close-modal"><i class="fas fa-times"></i></button>
      </div>
      <div style="margin-bottom:16px;color:#64748B;font-size:.9rem"><strong style="color:#0F172A" id="m-name"></strong> · <span id="m-email"></span> · <span id="m-phone"></span></div>
      <div style="background:#F8FAFC;padding:20px;border-radius:12px;white-space:pre-wrap;line-height:1.7" id="m-body"></div>
      <div style="margin-top:16px;color:#64748B;font-size:.85rem">Property: <strong id="m-prop"></strong></div>
    </div>
  </div>

  <script type="module">
    import { requireAdmin, logout } from '../js/auth.js';
    import { db, collection, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc } from '../js/firebase-config.js';
    import { escapeHtml, formatDate, toast } from '../js/ui.js';

    const user = await requireAdmin();
    document.getElementById('user-email').textContent = user.email;
    document.getElementById('user-avatar').textContent = (user.email[0] || 'A').toUpperCase();
    document.getElementById('logout-btn').addEventListener('click', async () => { await logout(); location.replace('../login.html'); });
    document.getElementById('toggle-sidebar').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));

    const tbody = document.getElementById('tbody');
    const count = document.getElementById('count');
    let items = [];

    const q = query(collection(db, 'messages'), orderBy('createdAt', 'desc'));
    onSnapshot(q, (snap) => {
      items = []; snap.forEach(d => items.push({ id: d.id, ...d.data() }));
      const unread = items.filter(m => !m.read).length;
      count.textContent = `${items.length} total · ${unread} unread`;
      tbody.innerHTML = items.length ? items.map(m => `
        <tr style="${m.read ? '' : 'background:#ECFEFF'}">
          <td><div class="row-cell"><div><strong>${escapeHtml(m.name || '—')}</strong><span>${escapeHtml(m.email || '')}</span></div></div></td>
          <td>${escapeHtml(m.subject || m.message?.slice(0, 60) || '—')}</td>
          <td>${escapeHtml(m.propertyTitle || '—')}</td>
          <td>${formatDate(m.createdAt)}</td>
          <td>${m.read ? '<span class="chip">Read</span>' : '<span class="chip green">New</span>'}</td>
          <td><div class="row-actions">
            <button class="btn-icon" data-view="${m.id}" title="View"><i class="fas fa-eye"></i></button>
            <button class="btn-icon danger" data-del="${m.id}" title="Delete"><i class="fas fa-trash"></i></button>
          </div></td>
        </tr>
      `).join('') : '<tr><td colspan="6" class="empty-row">No messages yet.</td></tr>';

      tbody.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', async () => {
        const m = items.find(x => x.id === b.dataset.view);
        document.getElementById('m-subject').textContent = m.subject || 'Inquiry';
        document.getElementById('m-name').textContent = m.name || '';
        document.getElementById('m-email').textContent = m.email || '';
        document.getElementById('m-phone').textContent = m.phone || '';
        document.getElementById('m-body').textContent = m.message || '';
        document.getElementById('m-prop').textContent = m.propertyTitle || '—';
        document.getElementById('modal').style.display = 'flex';
        if (!m.read) await updateDoc(doc(db, 'messages', m.id), { read: true });
      }));
      tbody.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
        if (!confirm('Delete this message?')) return;
        try { await deleteDoc(doc(db, 'messages', b.dataset.del)); toast('Message deleted', 'success'); }
        catch { toast('Delete failed', 'error'); }
      }));
    });

    document.getElementById('close-modal').addEventListener('click', () => document.getElementById('modal').style.display = 'none');
    document.getElementById('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') e.currentTarget.style.display = 'none'; });
  </script>
</body>
</html>
