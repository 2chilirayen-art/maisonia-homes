<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My favorites — RaniaDjerba</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/swiper@11/swiper-bundle.min.css" />
  <script defer src="https://unpkg.com/swiper@11/swiper-bundle.min.js"></script>
</head>
<body>
  <header class="nav scrolled" style="background:white">
    <div class="container nav-inner">
      <a class="logo" href="index.html">Rania<span>Djerba</span></a>
      <nav><ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="properties.html">Properties</a></li>
        <li><a href="favorites.html" class="active">Favorites</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul></nav>
      <a href="login.html" class="btn btn-primary" style="padding:10px 20px"><i class="fas fa-lock"></i> Admin</a>
      <button class="nav-toggle"><i class="fas fa-bars"></i></button>
    </div>
  </header>

  <section class="page-head">
    <div class="container">
      <h1>Your favorites</h1>
      <p>Properties you've saved for later. Click the heart to remove.</p>
    </div>
  </section>

  <div class="container" style="padding-top:50px;padding-bottom:80px">
    <div class="grid-3" id="fav-grid"></div>
  </div>

  <footer class="footer">
    <div class="container footer-bottom" style="border:none">
      <span>© 2026 RaniaDjerba.</span>
    </div>
  </footer>

  <script type="module">
    import { initNavbar } from './js/ui.js';
    import { subscribeProperties, renderGrid, renderSkeleton } from './js/properties.js';
    import { getFavorites } from './js/favorites.js';

    initNavbar();
    const grid = document.getElementById('fav-grid');
    renderSkeleton(grid, 3);

    subscribeProperties((items) => {
      const favs = getFavorites();
      const mine = items.filter(p => favs.includes(p.id));
      if (!mine.length) {
        grid.innerHTML = `
          <div class="empty" style="grid-column:1/-1">
            <div class="icn"><i class="far fa-heart"></i></div>
            <h3>No favorites yet</h3>
            <p>Browse properties and tap the heart icon to save them here.</p>
            <a class="btn btn-primary" style="margin-top:20px" href="properties.html">Explore properties</a>
          </div>`;
        return;
      }
      renderGrid(grid, mine);
    });
  </script>
</body>
</html>
