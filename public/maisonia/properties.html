<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Properties — RaniaDjerba</title>
  <meta name="description" content="Browse all available rental properties on RaniaDjerba." />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/swiper@11/swiper-bundle.min.css" />
  <script defer src="https://unpkg.com/swiper@11/swiper-bundle.min.js"></script>
  <style>
    .nav { background: rgba(15,23,42,.95); backdrop-filter: blur(12px); }
    .nav .logo { color: var(--white); }
    .nav .nav-links a { color: rgba(255,255,255,.9); }
  </style>
</head>
<body>
  <header class="nav scrolled" style="background:white">
    <div class="container nav-inner">
      <a class="logo" href="index.html">Rania<span>Djerba</span></a>
      <nav><ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="properties.html" class="active">Properties</a></li>
        <li><a href="favorites.html">Favorites</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul></nav>
      <a href="login.html" class="btn btn-primary" style="padding:10px 20px"><i class="fas fa-lock"></i> Admin</a>
      <button class="nav-toggle"><i class="fas fa-bars"></i></button>
    </div>
  </header>

  <section class="page-head">
    <div class="container">
      <h1>All properties</h1>
      <p>Browse our complete collection of rental homes. Filters update results in real time.</p>
    </div>
  </section>

  <div class="container">
    <div class="filters">
      <input id="f-search" placeholder="🔍 Search by title or address" />
      <input id="f-city" placeholder="City" />
      <select id="f-type">
        <option value="">Any type</option>
        <option>Apartment</option><option>Villa</option><option>House</option><option>Studio</option><option>Penthouse</option>
      </select>
      <select id="f-rooms">
        <option value="">Any bedrooms</option>
        <option value="1">1+</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option>
      </select>
      <select id="f-price">
        <option value="">Any price</option>
        <option value="1000">Under 1,000 TND</option>
        <option value="2500">Under 2,500 TND</option>
        <option value="5000">Under 5,000 TND</option>
        <option value="10000">Under 10,000 TND</option>
      </select>
    </div>

    <div id="result-count" style="margin-bottom:20px;color:var(--gray-3)"></div>
    <div class="grid-3" id="properties-grid"></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <footer class="footer" style="margin-top:80px">
    <div class="container footer-bottom" style="border:none">
      <span>© <span id="year"></span> RaniaDjerba.</span>
      <span><a href="index.html">← Back to home</a></span>
    </div>
  </footer>

  <script type="module">
    import { initNavbar, initReveal } from './js/ui.js';
    import { subscribeProperties, renderGrid, renderSkeleton } from './js/properties.js';

    initNavbar();
    initReveal();
    document.getElementById('year').textContent = new Date().getFullYear();

    const grid = document.getElementById('properties-grid');
    const pag = document.getElementById('pagination');
    const count = document.getElementById('result-count');
    const PER_PAGE = 9;
    let all = [], filtered = [], page = 1;

    const $ = id => document.getElementById(id);
    const filters = { search: '', city: '', type: '', rooms: '', price: '' };

    // pre-fill from query
    const qs = new URLSearchParams(location.search);
    ['city','type','price'].forEach(k => { const v = qs.get(k); if (v) { filters[k] = v; const el = $('f-' + k); if (el) el.value = v; } });

    function apply() {
      filtered = all.filter(p => {
        if (filters.search && !(`${p.title} ${p.address} ${p.city}`).toLowerCase().includes(filters.search.toLowerCase())) return false;
        if (filters.city && !(p.city || '').toLowerCase().includes(filters.city.toLowerCase())) return false;
        if (filters.type && p.type !== filters.type) return false;
        if (filters.rooms && (p.bedrooms || 0) < +filters.rooms) return false;
        if (filters.price && (p.price || 0) > +filters.price) return false;
        return true;
      });
      page = 1;
      render();
    }

    function render() {
      count.textContent = `${filtered.length} propert${filtered.length === 1 ? 'y' : 'ies'} found`;
      const start = (page - 1) * PER_PAGE;
      const slice = filtered.slice(start, start + PER_PAGE);
      renderGrid(grid, slice);
      const pages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
      let html = `<button ${page === 1 ? 'disabled' : ''} data-p="${page-1}"><i class="fas fa-chevron-left"></i></button>`;
      for (let i = 1; i <= pages; i++) html += `<button class="${i === page ? 'active' : ''}" data-p="${i}">${i}</button>`;
      html += `<button ${page === pages ? 'disabled' : ''} data-p="${page+1}"><i class="fas fa-chevron-right"></i></button>`;
      pag.innerHTML = html;
      pag.querySelectorAll('button[data-p]').forEach(b => b.addEventListener('click', () => { page = +b.dataset.p; render(); window.scrollTo({ top: 200, behavior: 'smooth' }); }));
    }

    renderSkeleton(grid, 6);
    subscribeProperties((items) => { all = items; apply(); });

    ['search','city','type','rooms','price'].forEach(k => {
      $('f-' + k).addEventListener('input', e => { filters[k] = e.target.value; apply(); });
    });
  </script>
</body>
</html>
